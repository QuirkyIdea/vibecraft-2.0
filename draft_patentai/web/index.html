<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DraftPatenAI</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 24px;
        background: #f7f7f9;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
      }
      h1 {
        margin-top: 0;
      }
      label {
        display: block;
        margin-top: 12px;
        font-weight: bold;
      }
      textarea, select, input[type="file"] {
        width: 100%;
        margin-top: 6px;
      }
      textarea {
        min-height: 160px;
        padding: 10px;
        font-family: inherit;
      }
      .actions {
        margin-top: 16px;
      }
      button {
        padding: 10px 16px;
        font-size: 14px;
      }
      .status {
        margin-top: 12px;
        color: #b00020;
      }
      .output {
        margin-top: 16px;
      }
      .output textarea {
        min-height: 240px;
        background: #f2f2f2;
      }
      .loading {
        color: #0b5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>DraftPatenAI</h1>

      <label for="textInput">Paste text (optional)</label>
      <textarea id="textInput" placeholder="Paste raw text here..."></textarea>

      <label for="pdfInput">Upload PDF (optional)</label>
      <input id="pdfInput" type="file" accept="application/pdf" />

      <label for="modeSelect">Output type</label>
      <select id="modeSelect">
        <option value="patent">Patent Draft</option>
        <option value="research">Research Paper Draft</option>
      </select>

      <div class="actions">
        <button id="generateBtn">Generate Draft</button>
      </div>

      <div id="status" class="status"></div>

      <div class="output">
        <label for="outputText">Generated draft</label>
        <textarea id="outputText" readonly></textarea>
      </div>
    </div>

    <script>
      const textInput = document.getElementById("textInput");
      const pdfInput = document.getElementById("pdfInput");
      const modeSelect = document.getElementById("modeSelect");
      const generateBtn = document.getElementById("generateBtn");
      const statusEl = document.getElementById("status");
      const outputText = document.getElementById("outputText");

      function setStatus(message, isLoading = false) {
        statusEl.textContent = message;
        statusEl.className = isLoading ? "status loading" : "status";
      }

      generateBtn.addEventListener("click", async () => {
        outputText.value = "";
        setStatus("");

        const text = textInput.value.trim();
        const pdfFile = pdfInput.files[0];
        const mode = modeSelect.value;

        if (!text && !pdfFile) {
          setStatus("Please provide text or a PDF file.");
          return;
        }

        const formData = new FormData();
        formData.append("mode", mode);
        if (text) {
          formData.append("text", text);
        }
        if (pdfFile) {
          formData.append("pdf", pdfFile);
        }

        try {
          setStatus("Generating...", true);
          const response = await fetch("/generate", {
            method: "POST",
            body: formData
          });
          const data = await response.json();
          if (!response.ok) {
            throw new Error(data.detail || "Request failed");
          }
          outputText.value = data.output || "";
          setStatus("");
        } catch (err) {
          setStatus(err.message || "Unexpected error");
        }
      });
    </script>
  </body>
</html>
